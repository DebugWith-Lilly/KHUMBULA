
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KHUMBULA | Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #F6EFE6;
            color: #44352D;
            min-height: 100vh;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px 18px;
            position: relative;
            overflow: hidden;
        }

        .decoration {
            position: absolute;
            width: 150px;
            height: 150px;
            background: #C26638;
            opacity: 0.85;
            pointer-events: none;
        }

        .decoration.top {
            top: -65px;
            left: -45px;
            border-radius: 0 0 100% 0;
        }

        .decoration.bottom {
            bottom: -75px;
            right: -45px;
            border-radius: 100% 0 0 0;
            background: #85865B;
        }

        .login-card {
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 1;
            background: #FFF8F0;
            border: 1px solid #EAD8C8;
            border-radius: 25px;
            padding: 36px;
            box-shadow: 0 15px 45px rgba(117, 69, 47, 0.12);
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            display: block;
            margin: 0 auto 18px;
        }

        .brand h1 {
            font-family: 'Playfair Display', serif;
            color: #75452F;
            font-size: clamp(2rem, 6vw, 2.7rem);
            line-height: 1.2;
            margin-bottom: 9px;
        }

        .brand p {
            font-size: 0.87rem;
            color: #806B53;
            line-height: 1.6;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 17px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        label,
        .section-label {
            color: #75452F;
            font-size: 0.88rem;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            border: 1.5px solid #DECBBB;
            border-radius: 12px;
            background: #FFFCF8;
            color: #44352D;
            font: inherit;
            font-size: 0.92rem;
            outline: none;
            transition: 0.2s ease;
        }

        input:focus {
            border-color: #C26638;
            box-shadow: 0 0 0 3px rgba(194, 102, 56, 0.12);
        }

        input::placeholder {
            color: #B5A397;
        }

        .password-wrapper {
            display: flex;
            gap: 8px;
        }

        .password-wrapper input {
            flex: 1;
            min-width: 0;
        }

        .toggle-button {
            padding: 0 13px;
            border: 1px solid #DECBBB;
            border-radius: 12px;
            background: #F3E5D8;
            color: #75452F;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .toggle-button:hover {
            background: #EAD5C3;
        }

        .language-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .language-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .language-option {
            position: relative;
            border: 1.5px solid #E3D2C3;
            border-radius: 15px;
            background: #FFFCF8;
            padding: 15px 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 9px;
            font-family: inherit;
            color: #75452F;
            transition: all 0.2s ease;
        }

        .language-option:hover {
            border-color: #C26638;
            transform: translateY(-2px);
        }

        .language-option.selected {
            border-color: #C26638;
            background: #F8E9DC;
            box-shadow: 0 0 0 2px rgba(194, 102, 56, 0.10);
        }

        .language-icon {
            width: 43px;
            height: 43px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F0DFD0;
            color: #A85D37;
        }

        .language-option.selected .language-icon {
            background: #C26638;
            color: #FFF8F0;
        }

        .language-icon svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .language-name {
            font-size: 0.87rem;
            font-weight: 600;
        }

        .language-description {
            font-size: 0.7rem;
            color: #927A68;
            text-align: center;
            line-height: 1.5;
        }

        .language-check {
            position: absolute;
            top: 9px;
            right: 9px;
            width: 17px;
            height: 17px;
            border-radius: 50%;
            background: #C26638;
            color: white;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }

        .language-option.selected .language-check {
            display: flex;
        }

        .forgot-password {
            align-self: flex-end;
            color: #92715C;
            text-decoration: none;
            font-size: 0.82rem;
            margin-top: -4px;
        }

        .forgot-password:hover {
            color: #C26638;
            text-decoration: underline;
        }

        .primary-btn {
            width: 100%;
            border: none;
            border-radius: 50px;
            background: #C26638;
            color: #FFF8F0;
            padding: 14px 20px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            margin-top: 3px;
            transition: 0.2s ease;
        }

        .primary-btn:hover {
            background: #A9532E;
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(194, 102, 56, 0.2);
        }

        .primary-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            padding: 11px;
            border-radius: 10px;
            font-size: 0.83rem;
            overflow-wrap: anywhere;
            line-height: 1.5;
        }

        .message:not(:empty) {
            display: block;
            background: #F3E5D8;
            color: #75452F;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 22px;
            }

            .language-option {
                padding: 13px 7px;
            }

            .brand-logo {
                width: 75px;
                height: 75px;
            }
        }
    </style>
</head>

<body>
    <main class="page">

        <div class="decoration top" aria-hidden="true"></div>
        <div class="decoration bottom" aria-hidden="true"></div>

        <section class="login-card">

            <header class="brand">
                <img
                    src="assets/logo.jpeg"
                    alt="KHUMBULA logo"
                    class="brand-logo">

                <h1 data-translate="welcome">It's lovely to have you back</h1>

                <p data-translate="slogan">
                    A little help remembering, a little more freedom living.
                </p>
            </header>

            <form class="login-form" id="login-form">

                <div class="input-group">
                    <label for="email" data-translate="emailLabel">
                        Your email address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="username"
                        required>
                </div>

                <div class="input-group">
                    <label for="password" data-translate="passwordLabel">
                        Your password
                    </label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            class="toggle-button"
                            id="togglePassword"
                            aria-label="Show password">
                            Show
                        </button>
                    </div>
                </div>

                <div class="language-section">

                    <span class="section-label" data-translate="languageLabel">
                        Choose the language that feels right
                    </span>

                    <div class="language-options">

                        <button
                            type="button"
                            class="language-option selected"
                            data-language="en"
                            aria-pressed="true">

                            <span class="language-check">✓</span>

                            <span class="language-icon">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M4 5h16v11H9l-5 4V5z"/>
                                    <path d="M8 9h8M8 12h5"/>
                                </svg>
                            </span>

                            <span class="language-name">English</span>
                            <span class="language-description">
                                A familiar way to continue
                            </span>
                        </button>

                        <button
                            type="button"
                            class="language-option"
                            data-language="zu"
                            aria-pressed="false">

                            <span class="language-check">✓</span>

                            <span class="language-icon">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M4 5h16v11H9l-5 4V5z"/>
                                    <path d="M8 9h8M8 12h5"/>
                                    <path d="M16 14l2 2"/>
                                </svg>
                            </span>

                            <span class="language-name">IsiZulu</span>
                            <span class="language-description">
                                Qhubeka ngesiZulu
                            </span>
                        </button>

                    </div>

                    <input
                        type="hidden"
                        id="selected-language"
                        name="language"
                        value="en">
                </div>

                <a
                    href="#"
                    class="forgot-password"
                    id="forgot-password"
                    data-translate="forgot">
                    Need help signing in?
                </a>

                <p
                    id="login-message"
                    class="message"
                    role="status"
                    aria-live="polite">
                </p>

                <button
                    type="submit"
                    class="primary-btn"
                    id="login-button"
                    data-translate="loginButton">
                    Welcome back
                </button>

            </form>
        </section>
    </main>

    <script>
        const translations = {
            en: {
                welcome: "It's lovely to have you back",
                slogan: "A little help remembering, a little more freedom living.",
                emailLabel: "Your email address",
                emailPlaceholder: "Enter your email",
                passwordLabel: "Your password",
                passwordPlaceholder: "Enter your password",
                languageLabel: "Choose the language that feels right",
                forgot: "Need help signing in?",
                loginButton: "Welcome back",
                showPassword: "Show",
                hidePassword: "Hide",
                showPasswordLabel: "Show password",
                hidePasswordLabel: "Hide password"
            },

            zu: {
                welcome: "Siyakujabulela ukukubona futhi",
                slogan: "Usizo oluncane lokukhumbula, inkululeko eyengeziwe yokuphila.",
                emailLabel: "Ikheli lakho le-imeyili",
                emailPlaceholder: "Faka i-imeyili yakho",
                passwordLabel: "Iphasiwedi yakho",
                passwordPlaceholder: "Faka iphasiwedi yakho",
                languageLabel: "Khetha ulimi olukhululekile kuwe",
                forgot: "Udinga usizo lokungena?",
                loginButton: "Siyakwamukela futhi",
                showPassword: "Bonisa",
                hidePassword: "Fihla",
                showPasswordLabel: "Bonisa iphasiwedi",
                hidePasswordLabel: "Fihla iphasiwedi"
            }
        };

        const languageOptions = document.querySelectorAll(".language-option");
        const selectedLanguage = document.getElementById("selected-language");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        function updateLanguage(language) {
            const text = translations[language] || translations.en;

            document.documentElement.lang = language === "zu" ? "zu" : "en";

            document.querySelectorAll("[data-translate]").forEach(element => {
                const key = element.dataset.translate;

                if (text[key]) {
                    element.textContent = text[key];
                }
            });

            emailInput.placeholder = text.emailPlaceholder;
            passwordInput.placeholder = text.passwordPlaceholder;

            if (passwordInput.type === "password") {
                togglePassword.textContent = text.showPassword;
                togglePassword.setAttribute("aria-label", text.showPasswordLabel);
            } else {
                togglePassword.textContent = text.hidePassword;
                togglePassword.setAttribute("aria-label", text.hidePasswordLabel);
            }
        }

        languageOptions.forEach(option => {
            option.addEventListener("click", () => {
                const language = option.dataset.language;

                languageOptions.forEach(item => {
                    item.classList.remove("selected");
                    item.setAttribute("aria-pressed", "false");
                });

                option.classList.add("selected");
                option.setAttribute("aria-pressed", "true");

                selectedLanguage.value = language;

                updateLanguage(language);
            });
        });

        togglePassword.addEventListener("click", () => {
            const language = selectedLanguage.value;
            const text = translations[language] || translations.en;
            const isPassword = passwordInput.type === "password";

            passwordInput.type = isPassword ? "text" : "password";

            togglePassword.textContent = isPassword
                ? text.hidePassword
                : text.showPassword;

            togglePassword.setAttribute(
                "aria-label",
                isPassword ? text.hidePasswordLabel : text.showPasswordLabel
            );
        });

        updateLanguage("en");
    </script>

<script type="module" src="auth.js"></script>
</body>
</html>
