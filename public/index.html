
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KHUMBULA | Welcome</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --cream: #F6EFE6;
      --forest: #2B422A;
      --green: #364935;
      --terracotta: #C26638;
      --tan: #E8B87D;
      --text: #262626;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--cream);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .welcome-card {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      background-color: var(--cream);
      overflow: hidden;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      padding: 45px 20px;
    }

    .content-wrapper {
      position: relative;
      z-index: 5;

      width: 100%;
      max-width: 560px;

      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;

      padding: 0 25px;
    }

    /* LARGE CENTRAL LOGO */

    .logo-container {
      width: clamp(190px, 30vw, 270px);
      height: clamp(190px, 30vw, 270px);

      display: flex;
      justify-content: center;
      align-items: center;

      margin-bottom: 12px;
    }

    .khumbula-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .brand-title {
      font-size: clamp(2.8rem, 5vw, 3.8rem);
      font-weight: 700;
      color: var(--forest);
      letter-spacing: -0.8px;
      line-height: 1.05;
      margin-bottom: 12px;
    }

    .brand-tagline {
      font-size: clamp(0.9rem, 2vw, 1.05rem);
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.1px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .brand-subtext {
      font-size: clamp(0.85rem, 1.8vw, 0.95rem);
      line-height: 1.8;
      font-weight: 400;
      color: #5B5148;
      margin-bottom: 35px;
    }

    /* GET STARTED BUTTON */

    .action-container {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .btn-get-started {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      width: 100%;
      max-width: 220px;

      padding: 14px 20px;

      border-radius: 50px;
      border: none;

      background-color: var(--green);
      color: #FFFFFF;

      font-size: 0.92rem;
      font-weight: 500;
      font-family: inherit;

      text-decoration: none;
      cursor: pointer;

      box-shadow: 0 4px 14px rgba(54, 73, 53, 0.25);

      transition: all 0.25s ease;
    }

    .btn-get-started:hover {
      background-color: #293828;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(54, 73, 53, 0.35);
    }

    .btn-get-started:active {
      transform: translateY(0);
    }

    .btn-text {
      letter-spacing: 0.2px;
    }

    .btn-arrow {
      transition: transform 0.2s ease;
    }

    .btn-get-started:hover .btn-arrow {
      transform: translateX(4px);
    }

    .btn-get-started:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 4px;
    }

    /* TOP LEFT DECORATION */

    .top-left-decor {
      position: absolute;
      top: 0;
      left: 0;
      width: 155px;
      height: 165px;
      z-index: 1;
      pointer-events: none;
    }

    /* BOTTOM LEFT DECORATION */

    .bottom-left-decor {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 175px;
      height: 250px;
      z-index: 1;
      pointer-events: none;
    }

    /* BOTTOM RIGHT DECORATION */

    .bottom-right-decor {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 180px;
      height: 200px;
      z-index: 1;
      pointer-events: none;
    }

    /* MOBILE */

    @media (max-width: 600px) {
      .content-wrapper {
        padding: 0 18px;
      }

      .logo-container {
        width: 200px;
        height: 200px;
        margin-bottom: 10px;
      }

      .top-left-decor {
        width: 115px;
        height: 125px;
      }

      .bottom-left-decor {
        width: 125px;
        height: 180px;
      }

      .bottom-right-decor {
        width: 125px;
        height: 145px;
      }

      .brand-subtext {
        margin-bottom: 30px;
      }
    }

    /* SHORT SCREENS */

    @media (max-height: 700px) {
      .welcome-card {
        padding-top: 20px;
        padding-bottom: 20px;
      }

      .logo-container {
        width: 155px;
        height: 155px;
        margin-bottom: 5px;
      }

      .brand-title {
        margin-bottom: 8px;
      }

      .brand-tagline {
        margin-bottom: 15px;
      }

      .brand-subtext {
        margin-bottom: 20px;
      }
    }
  </style>
</head>

<body>

  <main class="welcome-card">

    <!-- TOP LEFT DECORATION -->

    <div class="top-left-decor" aria-hidden="true">
      <svg width="100%" height="100%" viewBox="0 0 155 165" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 0 H120 C120 0 100 45 60 55 C20 65 0 120 0 120 V0 Z" fill="#C26638"/>
        <path d="M0 50 C20 50 40 70 30 110 C20 150 0 165 0 165 V50 Z" fill="#E8B87D" opacity="0.85"/>
        <path d="M15 10 L35 40 M30 10 L50 35 M45 10 L65 30 M10 25 L25 50" stroke="#EFE1CE" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- MAIN CONTENT -->

    <section class="content-wrapper">

      <!-- LARGE KHUMBULA LOGO -->

      <div class="logo-container">
        <img
          src="assets/logo.jpeg"
          alt="KHUMBULA logo"
          class="khumbula-logo-img"
        >
      </div>

      <h1 class="brand-title">Khumbula</h1>

      <p class="brand-tagline">
  Care <span>·</span> Connect <span>·</span> Remember
</p>
        
    
      <p class="brand-subtext">
        Helping you remember the people<br>
        and moments that matter.
      </p>

      <!-- GET STARTED -->

      <div class="action-container">
        <a href="login.html" class="btn-get-started" id="getStartedBtn">
          <span class="btn-text">Get Started</span>

          <svg class="btn-arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </a>
      </div>

    </section>

    <!-- BOTTOM LEFT PROTEA DECORATION -->

    <div class="bottom-left-decor" aria-hidden="true">
      <svg width="100%" height="100%" viewBox="0 0 175 250" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M-10 120 C30 110 70 150 50 210 C10 210 -10 170 -10 120 Z" fill="#2E402D"/>
        <path d="M30 180 C80 160 110 200 80 250 C40 250 20 220 30 180 Z" fill="#4B5C40"/>
        <path d="M-20 200 C30 190 80 220 70 270 H-20 V200 Z" fill="#E8B87D" opacity="0.8"/>

        <g transform="translate(10, 140)">
          <path d="M35 50 C15 30 10 0 35 -10 C45 10 45 30 35 50 Z" fill="#C26638"/>
          <path d="M35 50 C25 25 30 -5 48 -15 C55 10 50 30 35 50 Z" fill="#D87846"/>
          <path d="M35 50 C35 20 50 -10 65 -12 C68 15 58 35 35 50 Z" fill="#C26638"/>
          <path d="M35 50 C45 25 65 0 80 5 C78 25 60 40 35 50 Z" fill="#D6A35C"/>
          <path d="M35 50 C5 35 -5 10 15 0 C25 20 30 38 35 50 Z" fill="#B85834"/>
          <path d="M35 50 L10 110" stroke="#2E402D" stroke-width="7" stroke-linecap="round"/>
        </g>
      </svg>
    </div>

    <!-- BOTTOM RIGHT DECORATION -->

    <div class="bottom-right-decor" aria-hidden="true">
      <svg width="100%" height="100%" viewBox="0 0 180 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M180 40 C110 40 40 100 20 200 H180 V40 Z" fill="#C26638"/>

        <g opacity="0.9">
          <path d="M180 80 L120 140 L180 200" stroke="#F6EFE6" stroke-width="12" stroke-linecap="square" fill="none"/>
          <path d="M180 105 L140 145 L180 185" stroke="#364935" stroke-width="10" stroke-linecap="square" fill="none"/>
          <path d="M180 125 L155 150 L180 175" stroke="#D6A35C" stroke-width="8" stroke-linecap="square" fill="none"/>
          <line x1="80" y1="200" x2="180" y2="100" stroke="#364935" stroke-width="6"/>
          <line x1="110" y1="200" x2="180" y2="130" stroke="#F6EFE6" stroke-width="6"/>
          <line x1="140" y1="200" x2="180" y2="160" stroke="#D6A35C" stroke-width="6"/>
        </g>
      </svg>
    </div>

  </main>

  <script type="module" src="script.js"></script>

</body>
</html>
